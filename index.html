<h1>工程相機 Archi Photo</h1>
<p>給營造工地與室內裝修現場使用的 Android 施工照片 App。</p>
<div class="card">
<h2>主要功能</h2>
<ul>
<li>可自訂欄位的工程浮水印（工程名稱、施工位置、工程項目、拍攝時間、GPS 座標等）</li>
<li>在手機上自動辨識照片屬於哪個工程項目並分類，不需要網路</li>
<li>以關鍵字搜尋施工照片，方便與業主、監造或設計單位討論</li>
<li>可選擇自動備份到使用者自己的群暉 NAS 或 Google 雲端硬碟</li>
</ul>
</div>
<p class="muted">目前為內部測試版本。</p>
